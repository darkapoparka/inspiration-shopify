name: Deploy DealerDesk CRM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dealerdesk-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Vercel credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Vercel deployment skipped because VERCEL_TOKEN is not available to this repository."
          fi

      - name: Set up Node.js
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link or create Vercel project
        if: steps.credentials.outputs.available == 'true'
        run: npx --yes vercel@latest link --yes --project dealerdesk-crm --scope tyj5 --token "$VERCEL_TOKEN"

      - name: Deploy production
        if: steps.credentials.outputs.available == 'true'
        id: deploy
        shell: bash
        run: |
          URL=$(npx --yes vercel@latest deploy --prod --yes --scope tyj5 --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production URL: $URL"

      - name: Verify public health endpoint
        if: steps.credentials.outputs.available == 'true'
        run: curl --fail --show-error --retry 8 --retry-delay 5 "${{ steps.deploy.outputs.url }}/api/health"
