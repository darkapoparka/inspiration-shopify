name: Deploy DealerDesk CRM

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dealerdesk-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check deployment credentials
        shell: bash
        run: |
          missing=0
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add a VERCEL_TOKEN repository secret before running this workflow."
            missing=1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the Neon DATABASE_URL as a repository secret before running this workflow."
            missing=1
          fi
          exit "$missing"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link or create Vercel project
        run: npx --yes vercel@latest link --yes --project dealerdesk-crm --scope tyj5 --token "$VERCEL_TOKEN"

      - name: Configure Neon database
        shell: bash
        run: |
          npx --yes vercel@latest env rm DATABASE_URL production --yes --scope tyj5 --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          printf '%s' "$DATABASE_URL" | npx --yes vercel@latest env add DATABASE_URL production --sensitive --scope tyj5 --token "$VERCEL_TOKEN"
          npx --yes vercel@latest env rm DATABASE_URL preview --yes --scope tyj5 --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          printf '%s' "$DATABASE_URL" | npx --yes vercel@latest env add DATABASE_URL preview --sensitive --scope tyj5 --token "$VERCEL_TOKEN"

      - name: Deploy production
        id: deploy
        shell: bash
        run: |
          URL=$(npx --yes vercel@latest deploy --prod --yes --scope tyj5 --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production URL: $URL"

      - name: Verify public health endpoint
        run: curl --fail --show-error --retry 8 --retry-delay 5 "${{ steps.deploy.outputs.url }}/api/health"
